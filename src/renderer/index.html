<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; img-src 'self' app: tile: data: vault: blob:; style-src 'self' app: 'unsafe-inline'; font-src 'self' app:; script-src 'self' app:; connect-src 'self' app: tile: vault:; frame-src 'self' about: blob: data: vault:">
<title>Holdfast Emergency Planning System</title>
